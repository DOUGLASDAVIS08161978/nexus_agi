version: '3.8'

services:
  nexus-income-api:
    build:
      context: .
      dockerfile: Dockerfile.income_api
    container_name: nexus_income_api
    ports:
      - "8000:8000"
    environment:
      - ADMIN_KEY=${ADMIN_KEY:-nexus_admin_2025}
      - STRIPE_API_KEY=${STRIPE_API_KEY:-}
      - CRYPTO_WALLET=${CRYPTO_WALLET:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - nexus-network

  # PostgreSQL for production data storage
  nexus-postgres:
    image: postgres:15
    container_name: nexus_postgres
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexus_secure_2025}
      - POSTGRES_DB=nexus_income
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nexus-network

  # Redis for caching and rate limiting
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-nexus_redis_2025}
    restart: unless-stopped
    networks:
      - nexus-network

  # Nginx reverse proxy
  nexus-nginx:
    image: nginx:alpine
    container_name: nexus_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - nexus-income-api
    restart: unless-stopped
    networks:
      - nexus-network

volumes:
  postgres_data:

networks:
  nexus-network:
    driver: bridge
