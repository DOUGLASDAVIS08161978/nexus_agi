# This workflow builds and deploys Nova ASI to Azure Web App
# on pushes to main or claude/** branches.
#
# Setup:
# 1. Set AZURE_WEBAPP_NAME below to your Azure Web App name
# 2. Add AZURE_WEBAPP_PUBLISH_PROFILE secret in repo Settings → Secrets
#    (download Publish Profile from Azure Portal → your Web App → Overview)

name: Build and deploy Nova ASI to Azure Web App

env:
  AZURE_WEBAPP_NAME: your-app-name  # set this to your Azure Web App name
  PYTHON_VERSION: '3.11'

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check Nova ASI
        run: python -m py_compile nova_asi_v29.py && echo "nova_asi_v29.py syntax OK"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/
            !.env
            !*.db

  deploy:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
