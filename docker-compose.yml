version: '3.8'

services:
  nexus-service:
    build:
      context: .
      dockerfile: Dockerfile.nexus
    container_name: nexus-agi-service
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
    volumes:
      - ./logs:/app/logs
      - nexus-data:/app/data
    command: python nexus_service.py --interval 300
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  aria-service:
    build:
      context: .
      dockerfile: Dockerfile.aria
    container_name: aria-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
    command: node aria_service.js --interval 300
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.aria
    container_name: nexus-mcp-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - MCP_PORT=3001
      - MCP_HOST=0.0.0.0
      - MCP_API_KEYS=${MCP_API_KEYS:-nexus-agi-default-key}
      - MCP_CORS_ORIGINS=${MCP_CORS_ORIGINS:-*}
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/app/logs
    command: node mcp_remote_server.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: quantum-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - nexus-service
      - aria-service
      - mcp-server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nexus-data:
    driver: local
