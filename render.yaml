services:
  - type: web
    name: nexus-agi-api
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements-api.txt"
    startCommand: "uvicorn api_gateway.main_complete:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-agi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

databases:
  - name: nexus-agi-db
    plan: starter
    databaseName: nexus_agi
    user: nexus_user
